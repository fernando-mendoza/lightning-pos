# Stack de tests del API multi-tenant — Docker-only, con Postgres.
#
# Uso (desde projects/lightning-pos/):
#   docker compose -f docker-compose.test-mt.yml run --rm --build backend-tests
#   docker compose -f docker-compose.test-mt.yml run --rm --build playwright   # E2E dashboard /admin
#   docker compose -f docker-compose.test-mt.yml down --volumes --remove-orphans
#
# Levanta Postgres efímero, corre las migraciones Alembic (servicio one-shot `migrate`),
# arranca el backend en TEST_MODE (wallet/exchange fakes) y ejecuta los tests /api/v2.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lpos
      POSTGRES_PASSWORD: test
      POSTGRES_DB: lightning_pos_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpos -d lightning_pos_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - test-net

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lightning-pos-backend:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      LPOS_DATABASE_URL: postgresql+asyncpg://lpos:test@postgres:5432/lightning_pos_test
      LPOS_JWT_SECRET: test-jwt-secret-fixed
      LPOS_DATA_ENCRYPTION_KEY: test-data-encryption-key-fixed
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - test-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lightning-pos-backend:latest
    environment:
      LPOS_TEST_MODE: "1"
      LPOS_DATABASE_URL: postgresql+asyncpg://lpos:test@postgres:5432/lightning_pos_test
      LPOS_JWT_SECRET: test-jwt-secret-fixed
      LPOS_DATA_ENCRYPTION_KEY: test-data-encryption-key-fixed
      LPOS_PUBLIC_BASE_URL: http://backend:8000
      LPOS_ALLOWED_ORIGINS: http://localhost
      LPOS_MAX_PIN_ATTEMPTS: "1000"
      # La suite entera pega desde una sola IP; sin esto el rate limit la bloquea.
      LPOS_RATE_LIMIT_LOGIN: "10000/60"
      LPOS_RATE_LIMIT_REGISTER: "10000/60"
      LPOS_RATE_LIMIT_REDEEM: "10000/60"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      - test-net

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    image: lightning-pos-backend-tests:latest
    command: ["pytest", "-v", "-s", "tests/test_mt_pairing.py", "tests/test_mt_orders.py", "tests/test_mt_admin.py", "tests/test_rate_limit.py"]
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - test-net

  # E2E del dashboard /admin (mismos contenedores frontend/playwright que la suite v1;
  # aquí el backend es el multi-tenant, así que admin-dashboard.spec.ts NO se salta).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: lightning-pos-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - test-net

  playwright:
    build:
      context: ./frontend/playwright
      dockerfile: Dockerfile
    image: lightning-pos-playwright:latest
    command: ["pnpm", "exec", "playwright", "test", "tests/admin-dashboard.spec.ts"]
    environment:
      FRONTEND_URL: http://frontend
      BACKEND_URL: http://backend:8000
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - test-net

networks:
  test-net:
    driver: bridge
